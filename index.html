<header><a class="logo" href="#">陈坤快跑<span>AFTER SCHOOL CLUB</span></a><div class="top"><button id="sound">声音 开</button><button id="pause">暂停</button></div></header>

const KEY='chenkunkuaipao-3d-v1';let wallet={coins:0,tickets:1,best:0};try{Object.assign(wallet,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch{}for(const k of Object.keys(wallet))if(!Number.isFinite(wallet[k])||wallet[k]<0)wallet[k]=0;
const s={phase:'menu',t:0,run:0,distance:0,coins:0,lane:0,x:0,y:0,vy:0,slide:0,gap:60,boost:0,shield:0,revive:0,inv:0,spawn:1,shot:12,paused:false};let last=0,toastTime=0,muted=false,audio;
function save(){try{localStorage.setItem(KEY,JSON.stringify(wallet));}catch{} }
function beep(f=700){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.connect(v);v.connect(audio.destination);o.frequency.setValueAtTime(f,audio.currentTime);v.gain.setValueAtTime(.025,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.start();o.stop(audio.currentTime+.15);}catch{} }
function toast(text){$('toast').textContent=text;toastTime=2.5;beep();}
function clearObjects(){for(const o of objects)scene.remove(o.g);objects.length=0;}
function reset(){clearObjects();Object.assign(s,{phase:'intro',t:0,run:0,distance:0,coins:0,lane:0,x:0,y:0,vy:0,slide:0,gap:60,boost:0,shield:0,revive:0,inv:0,spawn:1,shot:12,paused:false});$('menu').classList.add('hidden');$('result').classList.add('hidden');angel.g.visible=false;hero.g.visible=true;hero.body.scale.y=1;hut.visible=true;hut.position.set(-4,0,5);gate.position.z=-25;beep(350);}
function act(a){if(s.phase!=='run'||s.paused)return;if(a==='left')s.lane=Math.max(-1,s.lane-1);if(a==='right')s.lane=Math.min(1,s.lane+1);if(a==='jump'&&s.y===0){s.vy=8;s.slide=0;beep(430);}if(a==='slide'&&s.y===0)s.slide=.85;}
function draw(){if(s.phase!=='run'||s.paused||wallet.tickets<1)return;wallet.tickets--;const r=Math.random();if(r<.4){s.boost=6;toast('加速 6 秒！期间无敌');}else if(r<.65){s.revive++;toast('复活道具 +1');}else if(r<.85){s.shield++;toast('护盾 +1：抵挡一次撞击');}else{s.gap=Math.max(5,s.gap-18);toast('哎呀！反派靠近 18 米');}save();}
function hit(){if(s.inv>0||s.boost>0)return;s.inv=1.5;if(s.shield){s.shield--;toast('护盾挡住了撞击');return;}s.gap-=26;beep(130);toast('撞到了！反派正在接近');if(s.gap<=0)die();}
function die(){s.phase='ending';s.t=0;angel.g.visible=true;weapon.visible=false;wallet.best=Math.max(wallet.best,Math.floor(s.distance));save();}
function revive(){if(!s.revive)return;s.revive--;s.phase='run';s.gap=65;s.inv=3;s.y=0;s.vy=0;angel.g.visible=false;clearObjects();$('result').classList.add('hidden');toast('复活！继续冲');}
function pause(){if(!['run','intro'].includes(s.phase))return;s.paused=!s.paused;$('paused').classList.toggle('hidden',!s.paused);}
function spawn(type,lane,z){const g=new T.Group();g.position.set(lane*2.5,0,z);scene.add(g);if(type==='coin'){const m=new T.Mesh(coinGeo,mat('#f8c448'));m.rotation.z=Math.PI/2;m.position.y=1;g.add(m);}else if(type==='ticket'){const m=new T.Mesh(ticketGeo,mat('#ed8bb0'));m.position.y=1;g.add(m);box(g,0,1,.06,.1,.29,.02,'#fff8df');}else if(type==='low'){box(g,0,.48,0,1.65,.9,.7,'#e99b57');box(g,0,.87,0,1.8,.15,.8,'#ffedb9');}else if(type==='high'){for(const x of [-.8,.8])box(g,x,1.3,0,.13,2.6,.18,'#578b7e');box(g,0,1.95,0,1.8,.8,.3,'#f3bd55');}else if(type==='block'){box(g,0,1.2,0,1.8,2.4,1.3,'#7daba0');box(g,0,2.45,0,2,.15,1.4,'#edf0d6');label(g,'施工',0,1.5,.66,1.4);}else {box(g,0,.9,0,.8,.15,.3,'#78736b');}objects.push({g,type,lane,hit:false});}
function wave(){const safe=Math.floor(Math.random()*3)-1;for(let lane=-1;lane<=1;lane++){if(lane===safe){for(let n=0;n<4;n++)spawn('coin',lane,-66-n*2);if(Math.random()<.28)spawn('ticket',lane,-76);}else if(Math.random()<.85)spawn(['low','high','block'][Math.floor(Math.random()*3)],lane,-70);} }
function animatePerson(p,run,tm){for(let i=0;i<2;i++){p.legs[i].rotation.x=run?Math.sin(tm*12+i*Math.PI)*.7:0;p.arms[i].rotation.x=run?-Math.sin(tm*12+i*Math.PI)*.65:0;}p.body.position.y=run?Math.abs(Math.sin(tm*12))*.05:0;}
function update(dt){if(s.paused)return;s.t+=dt;toastTime-=dt;s.inv=Math.max(0,s.inv-dt);if(s.phase==='intro'){
 hero.g.position.set(-4+Math.min(s.t/1.7,1)*4,0,6-Math.min(s.t/1.7,1)*6);hero.g.rotation.y=s.t<1.7?Math.PI: s.t<3.5?0:Math.PI;boss.g.position.set(-4,0,7);boss.g.rotation.y=Math.PI;
 hero.face.scale.y=s.t>1.7&&s.t<3.5?.75:1;hero.arms[0].rotation.z=s.t>1.7&&s.t<3.5?-1:0;
 $('caption').textContent=s.t<1.7?'陈坤钻出了破屋…':s.t<3.5?'略略略，你追不上我！':'小心！反派丢出了武器！';
 weapon.visible=s.t>3.5;weapon.position.set(-4+(s.t-3.5)*5,1.2,7-(s.t-3.5)*11);weapon.rotation.x+=dt*14;
 if(s.t>4.8){s.phase='run';s.t=0;weapon.visible=false;hero.face.scale.y=1;hero.arms[0].rotation.z=0;}
 }else if(s.phase==='run'){
 s.run+=dt;const speed=(11+Math.min(s.distance/180,7))*(s.boost>0?1.6:1);s.distance+=speed*dt;s.gap=Math.min(100,s.gap+dt*.38);s.boost=Math.max(0,s.boost-dt);s.slide=Math.max(0,s.slide-dt);s.x+=(s.lane*2.5-s.x)*Math.min(dt*14,1);
 if(s.y>0||s.vy>0){s.vy-=22*dt;s.y+=s.vy*dt;if(s.y<0){s.y=0;s.vy=0;}}
 hero.g.position.set(s.x,s.y,0);hero.g.rotation.y=Math.PI;hero.body.scale.y=s.slide>0?.47:1;hero.g.visible=!(s.inv>0&&Math.floor(s.run*12)%2);
 boss.g.position.set(s.x*.7,0,3+Math.min(s.gap/25,3));boss.g.rotation.y=Math.PI;animatePerson(hero,true,s.run);animatePerson(boss,true,s.run);
 for(const d of decor){d.position.z+=speed*dt;if(d.position.z>25)d.position.z-=180;}for(const d of tiles){d.position.z+=speed*dt;if(d.position.z>12)d.position.z-=160;}gate.position.z+=speed*dt;if(gate.position.z>25)gate.position.z=-155;hut.position.z+=speed*dt;if(hut.position.z>25)hut.visible=false;
 s.spawn-=dt;if(s.spawn<=0){wave();s.spawn=2.35;}s.shot-=dt;if(s.shot<=0){toast('反派投掷！换道躲开');spawn('weapon',s.lane,-28);s.shot=13;}
 for(let i=objects.length-1;i>=0;i--){const o=objects[i];const prev=o.g.position.z;o.g.position.z+=speed*dt*(o.type==='weapon'?1.8:1);if(['coin','ticket'].includes(o.type))o.g.rotation.y+=dt*3;
 if(!o.hit&&prev<.6&&o.g.position.z>=-.65&&Math.abs(o.g.position.x-s.x)<.9){let collected=false;if(o.type==='coin'||o.type==='ticket'){if(s.y<1.6){if(o.type==='coin'){wallet.coins++;s.coins++;beep(1000);}else{wallet.tickets++;toast('捡到一张彩票');}save();collected=true;}}
 else{const safe=o.type==='low'?s.y>.85:o.type==='high'?s.slide>0:false;if(!safe)hit();collected=true;}if(collected){o.hit=true;o.g.visible=false;}}
 if(o.g.position.z>12){scene.remove(o.g);objects.splice(i,1);}}
 $('caption').textContent=s.distance<45?'放学别跑！':s.distance<85?'金币和彩票都在路上': '';
 }else if(s.phase==='ending'){
 hero.g.visible=true;hero.body.scale.y=1;animatePerson(hero,false,0);const lift=Math.max(0,s.t-1.4)*1.6;angel.g.position.set(s.x+1.2,Math.max(0,6-s.t*4)+lift,.2);hero.g.position.y=lift;angel.g.rotation.y=0;angel.arms[0].rotation.z=-1.2;$('caption').textContent='别怕，天使带你回家。';
 if(s.t>4.8){s.phase='result';$('result').classList.remove('hidden');$('score').textContent=`跑了 ${Math.floor(s.distance)} 米，收获 ${s.coins} 枚金币。最高纪录 ${wallet.best} 米。`;$('revive').classList.toggle('hidden',!s.revive);}
 }else if(s.phase==='menu'){hero.g.position.set(0,0,0);hero.g.rotation.y=.4;boss.g.position.set(-3,0,4);boss.g.rotation.y=.2;}
 ring.visible=s.boost>0||s.shield>0;ring.position.set(s.x,s.y+.1,0);ring.rotation.z+=dt;
}
function ui(){ $('distance').textContent=Math.floor(s.distance)+' m';$('coins').textContent=wallet.coins;$('tickets').textContent=wallet.tickets;$('gap').textContent=Math.max(0,Math.floor(s.gap))+' m';$('meter').value=s.gap;$('best').textContent='个人最佳 '+wallet.best+' 米';$('effects').textContent=[s.boost>0?'⚡ 加速 '+s.boost.toFixed(1)+'s':'',s.shield?'护盾 ×'+s.shield:'',s.revive?'复活 ×'+s.revive:''].filter(Boolean).join(' · ');$('draw').disabled=s.phase!=='run'||s.paused||wallet.tickets<1;$('buy').disabled=wallet.coins<100||s.paused;$('toast').style.opacity=toastTime>0?'1':'0';}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
function frame(ms){const dt=Math.min((ms-last)/1000||.016,.04);last=ms;update(dt);const menu=s.phase==='menu';const intro=s.phase==='intro';const desired=menu?new T.Vector3(10,7,13):intro?new T.Vector3(9,6,15):new T.Vector3(s.x*.24,5.5,10);camera.position.lerp(desired,1-Math.exp(-dt*3));target.set(menu?-2:s.x*.28,1.3,s.phase==='ending'?0:-8);camera.lookAt(target);ui();renderer.render(scene,camera);requestAnimationFrame(frame);}camera.position.set(10,7,13);requestAnimationFrame(frame);
 $('start').onclick=reset;$('again').onclick=()=>{hut.position.set(-4,0,5);reset();};$('revive').onclick=revive;$('draw').onclick=draw;$('buy').onclick=()=>{if(wallet.coins>=100&&!s.paused){wallet.coins-=100;wallet.tickets++;save();toast('兑换成功：彩票 +1');}};$('pause').onclick=pause;$('resume').onclick=pause;$('sound').onclick=()=>{muted=!muted;$('sound').textContent='声音 '+(muted?'关':'开');};
 const keys={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jump',w:'jump',' ':'jump',ArrowDown:'slide',s:'slide'};addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();if(!e.repeat)act(keys[e.key]);}if(e.key==='Escape'||e.key==='p')pause();if(e.key==='e')draw();});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));let touch=null;$('world').addEventListener('pointerdown',e=>touch={x:e.clientX,y:e.clientY});$('world').addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)act(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'slide':'jump');touch=null;});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!s.paused&&['run','intro'].includes(s.phase))pause();});
})();
</script></body></html>
